services:
  api:
    build: .                       # build the Dockerfile in this folder
    ports:
      - "8000:8000"                # host:container
    environment:
      # the host is `db`: the service name below. The app starts using this in M3.
      DATABASE_URL: postgresql://tinyshop:${POSTGRES_PASSWORD:-tinyshop}@db:5432/tinyshop
      CHAOS_ENABLED: "true"
    mem_limit: 300m
    depends_on:
      db:
        condition: service_healthy # wait until the db healthcheck passes, not just "started"
    restart: unless-stopped

  db:
    image: postgres:16             # official image, pinned major version
    environment:
      POSTGRES_USER: tinyshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinyshop}   # from .env or your shell; default for local dev
      POSTGRES_DB: tinyshop
    ports:
      - "5432:5432"                # so tools on your laptop (psql, tests) can connect
    volumes:
      - pgdata:/var/lib/postgresql/data                                  # named volume: data survives restarts
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # bind mount, read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyshop -d tinyshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.8                 # its default config stores logs on local disk: fine for a laptop
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro     # to read the other containers' logs
    ports:
      - "12345:12345"                                    # Alloy's own UI: shows its pipeline

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # local only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]

volumes:
  pgdata:

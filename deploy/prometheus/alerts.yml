groups:
  - name: tinyshop
    rules:
      - alert: TinyShopDown
        expr: up{job="tinyshop"} == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Prometheus can't scrape TinyShop"

      - alert: TinyShopHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "More than 5% of request fail"

      - alert: TinyShopHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "p95 latency is above 500 ms"
